name: Refresh parliamentary pulse

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: parliamentary-pulse-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    # Keep the capture environment stable while ubuntu-latest moves to 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx lxml
      - name: Capture and build data
        env:
          CAPTURE_MINUTES: "12"
          SCRAPER_DIR: "./vendor/Live_Subtitle_Scraper"
        run: ./scripts/run_pipeline.sh
      - name: Commit refreshed data
        run: |
          git config user.name "parliamentary-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/data/dashboard.json
          git diff --cached --quiet || git commit -m "Refresh parliamentary dashboard data"
          git push
