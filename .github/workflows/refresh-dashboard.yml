name: Refresh parliamentary pulse

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: |
          python -m pip install -r vendor/Live_Subtitle_Scraper/requirements.txt
      - name: Capture and build data
        env:
          CAPTURE_MINUTES: "12"
          SCRAPER_DIR: "./vendor/Live_Subtitle_Scraper"
        run: ./scripts/run_pipeline.sh
      - name: Commit refreshed data
        run: |
          git config user.name "parliamentary-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/data/dashboard.json
          git diff --cached --quiet || git commit -m "Refresh parliamentary dashboard data"
          git push
